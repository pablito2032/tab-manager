<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Manager</title>
  <meta name="description" content="Gestor personal de enlaces pendientes: guarda, organiza y consulta tus pestañas en una sola página.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <!--
    Aplicamos el tema ANTES de pintar la página para evitar el "parpadeo"
    de modo claro al cargar en modo oscuro. La clave debe coincidir con
    THEME_KEY en js/storage.js.
  -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('tabmanager:theme');
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.setAttribute('data-theme', pref);
        }
      } catch (e) { /* localStorage no disponible: se usa el tema del sistema */ }
    })();
  </script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Import map: dependencias desde CDN con versión fijada (sin npm ni compilación) -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.prod.js",
        "sortablejs": "https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/modular/sortable.esm.js"
      }
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <!-- Punto de montaje de Vue -->
  <div id="app">
    <!-- Contenido mostrado mientras carga Vue (o si falla JavaScript) -->
    <noscript>
      <p class="boot-message">Tab Manager necesita JavaScript para funcionar.</p>
    </noscript>
    <p class="boot-message" aria-live="polite">Cargando…</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
